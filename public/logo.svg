<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <!-- Shield gradient: Royal Blue to Deep Navy -->
    <linearGradient id="shieldGrad" x1="60" y1="0" x2="60" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <!-- Notebook gradient -->
    <linearGradient id="notebookGrad" x1="60" y1="30" x2="60" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <!-- Lock gradient: Mint to Emerald -->
    <linearGradient id="lockGrad" x1="46" y1="58" x2="74" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Subtle shine on shield -->
    <linearGradient id="shineGrad" x1="30" y1="0" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M60 4L10 28V68C10 98 32 124 60 136C88 124 110 98 110 68V28L60 4Z" fill="url(#shieldGrad)" stroke="#1E3A8A" stroke-width="2"/>

  <!-- Shield shine overlay -->
  <path d="M60 4L10 28V68C10 98 32 124 60 136C88 124 110 98 110 68V28L60 4Z" fill="url(#shineGrad)"/>

  <!-- Shield inner border -->
  <path d="M60 14L20 34V68C20 94 38 115 60 126C82 115 100 94 100 68V34L60 14Z" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Notebook body -->
  <rect x="32" y="32" width="56" height="72" rx="5" fill="url(#notebookGrad)" stroke="#1E3A8A" stroke-width="1.5"/>

  <!-- Notebook inner shadow -->
  <rect x="33" y="33" width="54" height="70" rx="4" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Notebook spiral binding -->
  <circle cx="32" cy="44" r="3.5" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1"/>
  <circle cx="32" cy="58" r="3.5" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1"/>
  <circle cx="32" cy="72" r="3.5" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1"/>
  <circle cx="32" cy="86" r="3.5" fill="#60A5FA" stroke="#1E3A8A" stroke-width="1"/>

  <!-- Spiral binding inner dots -->
  <circle cx="32" cy="44" r="1.5" fill="#1E3A8A"/>
  <circle cx="32" cy="58" r="1.5" fill="#1E3A8A"/>
  <circle cx="32" cy="72" r="1.5" fill="#1E3A8A"/>
  <circle cx="32" cy="86" r="1.5" fill="#1E3A8A"/>

  <!-- Notebook lines -->
  <line x1="42" y1="48" x2="78" y2="48" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="58" x2="72" y2="58" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="68" x2="76" y2="68" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>

  <!-- Lock shackle -->
  <path d="M50 78V70C50 64.477 54.477 60 60 60C65.523 60 70 64.477 70 70V78" stroke="url(#lockGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Lock body -->
  <rect x="46" y="78" width="28" height="22" rx="4" fill="url(#lockGrad)" stroke="#065F46" stroke-width="1.5"/>

  <!-- Lock highlight -->
  <rect x="47" y="79" width="26" height="10" rx="3" fill="rgba(255,255,255,0.12)"/>

  <!-- Lock keyhole -->
  <circle cx="60" cy="87" r="3" fill="#065F46"/>
  <rect x="58.5" y="87" width="3" height="7" rx="1" fill="#065F46"/>
</svg>
